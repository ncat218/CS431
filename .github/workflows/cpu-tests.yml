name: CS431 CPU verification
on: [push, pull_request]
jobs:
  workflow-and-shared-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python run.py shared verify
      - run: python run.py shared unpack
      - run: python monkey/run.py status
      - run: python monkey/run.py phase3 --plan-only
  monkey-snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monkey/phase3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-controller.txt -r requirements-config-tests.txt
      - run: python -m pip install --no-deps mmengine==0.10.7
      - run: python -m unittest discover -s tests -v
      - run: python run_all.py --plan-only
